<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App Store 제출용: 정사각형, 둥근 모서리/투명도 없음 (Apple이 마스크 적용) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0d14"/>
      <stop offset="100%" style="stop-color:#141820"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Speech bubble (512 기준 좌표 × 2) -->
  <path d="M280 280 h464 a80 80 0 0 1 80 80 v280 a80 80 0 0 1 -80 80 h-280 l-120 100 v-100 h-64 a80 80 0 0 1 -80 -80 v-280 a80 80 0 0 1 80 -80z"
        fill="none" stroke="#7ee8a2" stroke-width="32" stroke-linejoin="round"/>
  <!-- T letter -->
  <text x="512" y="600" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="900" font-size="320" fill="#7ee8a2">T</text>
  <!-- Accent dot -->
  <circle cx="740" cy="340" r="28" fill="#fbbf24"/>
</svg>
